[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogit"
version = "0.2.0"
description = "Your folder, kept safe and put online, without learning git. Nothing to install."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["git", "version-control", "no-code", "beginner", "backup", "github", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Education",
]
# Nothing is required, on any operating system. It drives the git program that
# is already installed, and gets out of the way if there is not one.
dependencies = []

[project.scripts]
nanogit = "nanogit.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nanogit"

[tool.setuptools]
packages = ["nanogit"]
include-package-data = true

[tool.setuptools.package-data]
nanogit = ["web/*"]
